name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types, build, claims & brand check
        run: pnpm verify
      - name: Built output sanity
        run: |
          test -f dist/index.html
          test -f dist/id/index.html
          test -f dist/404.html
          test -f dist/sitemap-index.xml
          test -f dist/og/en-home.png
          test "$(cat dist/CNAME)" = "usai.sakala.dev"
          grep -q 'hreflang="id"' dist/index.html
          grep -q 'application/ld+json' dist/index.html
